name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Never let two runs write the same cache entry.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: lint, types, build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Secret scan
        run: npm run scan:secrets

      - name: Types
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Test
        # Runs the TypeScript sources directly through Node's own type
        # stripping, so the suite needs no test-runner dependency.
        run: npm test

      - name: Build
        run: npm run build

  ui-audit:
    name: layout audit (1512px + 390px)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: verify

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Start production server
        run: |
          npm run build
          npm run start &
          # 127.0.0.1, not localhost: `next start` pins that address, and on a
          # dual-stack runner `localhost` can land on ::1 with nothing there.
          for i in $(seq 1 60); do
            if curl -fsS -o /dev/null http://127.0.0.1:3000/; then break; fi
            sleep 2
          done
          curl -fsS -o /dev/null http://127.0.0.1:3000/

      - name: Audit routes for overflow, clipping and console errors
        # The script exits non-zero on any real defect, and also aborts loudly if
        # a route never rendered, so a dead server cannot look like a clean run.
        run: npm run audit:ui

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-audit-screenshots
          path: /tmp/anim-audit/*.png
          if-no-files-found: ignore
          retention-days: 7
