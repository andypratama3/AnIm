name: secret-guard

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fail if secret-shaped strings are committed
        run: ./scripts/secret-scan.sh --all

      - name: Guard against credential files entering the tree
        run: |
          set -euo pipefail
          bad=$(git ls-files | grep -E '(^|/)(\.env($|\.)|auth\.json$|credentials\.json$|.*\.(pem|key|p12|pfx)$|id_(rsa|ed25519))' || true)
          if [ -n "$bad" ]; then
            echo "::error::credential-shaped files are tracked:"; echo "$bad"; exit 1
          fi
          echo "no credential files tracked"

      - name: Typecheck
        run: npm ci --no-audit --no-fund && npx tsc --noEmit
